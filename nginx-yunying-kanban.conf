# 企业微信鉴权 - Nginx 站点配置
# 放置路径：/etc/nginx/sites-available/yunying-kanban
# 启用：ln -s /etc/nginx/sites-available/yunying-kanban /etc/nginx/sites-enabled/
#
# 关键：所有请求一律转发给后端鉴权服务，Nginx 不直接 serve 任何静态文件，
#       确保不存在绕过鉴权的路径（WW_verify_*.txt 由后端免鉴权返回，供企业微信校验域名用）。

server {
    listen 80;
    listen [::]:80;
    server_name yunying.xnkq.net;

    # 启用 HTTPS 后取消下一行注释，强制跳转
    # return 301 https://$server_name$request_uri;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8899;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_buffering off;
    }

    access_log /var/log/nginx/yunying-kanban.access.log;
    error_log  /var/log/nginx/yunying-kanban.error.log;
}

